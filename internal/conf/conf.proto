syntax = "proto3";
package kratos.api;

option go_package = "account/internal/conf;conf";

import "google/protobuf/duration.proto";

import "validate/validate.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Auth auth = 3;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Database {
    string driver = 1;
    string source = 2;
  }
  message Redis {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration read_timeout = 3;
    google.protobuf.Duration write_timeout = 4;
    string password = 5;
    int32 db = 6;
  }
  Database database = 1;
  Redis redis = 2;
}

message Auth{
  Jwt jwt = 1;
}

message Jwt {
  string secret = 1[(validate.rules).string = {min_len:1}];
  string issuer = 2;
  int64 expires_in = 3; // 过期时间(seconds)
}