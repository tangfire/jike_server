syntax = "proto3";

package account.v1;

import "google/api/annotations.proto";
import "validate/validate.proto";

option go_package = "jike_server/api/account/v1;v1";


service Account{
  rpc Authorizations(AuthorizationsReq) returns (AuthorizationsResp){
    option(google.api.http) = {
      post: "/v1/authorizations",
      body:"*"
    };
  }

  rpc GetAccountInfo(GetAccountReq) returns (GetAccountResp){
    option(google.api.http) = {
      get: "/v1/user/profile",
    };
  }

}


message AuthorizationsReq {
  string mobile = 1 [(validate.rules).string.len = 11];
  string code = 2 [(validate.rules).string.len = 6];
}

message AuthorizationsResp{
  string token = 1;
  int64 expires_at = 2;
  int64 user_id = 3;
  string mobile = 4;
  string nickname = 5;
}

message GetAccountReq{

}

message GetAccountResp{
  string birthday = 1;
  int32 gender = 2;
  int64 id = 3;
  string mobile = 4;
  string nickname = 5;
  string avatar = 6;
}


